<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Шлях Героя - Калькулятор Архетипів</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: linear-gradient(135deg, #1a0f0a, #3d2113, #1a0f0a);
            min-height: 100vh;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        .container {
            background: linear-gradient(145deg, #f5ede4, #e8dccc);
            max-width: 500px;
            width: 100%;
            padding: 25px 20px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.6), 0 0 0 2px #b8956a inset;
            margin-top: 10px;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .main-title {
            text-align: center;
            font-size: 30px;
            font-weight: 700;
            color: #3d2113;
            letter-spacing: 4px;
            text-shadow: 1px 1px 0 rgba(184, 149, 106, 0.3);
            line-height: 1.2;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .main-title span {
            color: #b8860b;
        }

        .sub-title {
            text-align: center;
            font-size: 13px;
            color: #8b6b3c;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 2px;
            margin-bottom: 16px;
            border-bottom: 2px solid #b8956a;
            padding-bottom: 12px;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .sub-title span {
            color: #b8860b;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 700;
            color: #3d2113;
            margin-bottom: 6px;
            font-size: 15px;
            letter-spacing: 0.5px;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .date-input-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .date-input-wrapper input {
            flex: 1;
            padding: 16px 12px;
            border: 2px solid #b8860b;
            border-radius: 14px;
            font-size: 18px;
            background: #fcf8f2;
            transition: border-color 0.3s, box-shadow 0.3s;
            color: #2c1810;
            font-weight: 600;
            height: 60px;
            text-align: center;
            min-width: 0;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .date-input-wrapper input:focus {
            outline: none;
            border-color: #8b6b3c;
            box-shadow: 0 0 0 4px rgba(184, 149, 106, 0.25);
        }

        .date-input-wrapper input::placeholder {
            color: #b8956a;
            font-weight: 400;
            font-size: 14px;
        }

        .date-input-wrapper .separator {
            font-size: 24px;
            font-weight: 700;
            color: #b8860b;
            padding: 0 2px;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #5c3a20, #3d2113);
            color: #f5ede4;
            border: 2px solid #b8860b;
            border-radius: 14px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
            letter-spacing: 2px;
            height: 60px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(92, 58, 32, 0.4);
            background: linear-gradient(135deg, #6b4628, #4a2818);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 5px 15px rgba(92, 58, 32, 0.3);
        }

        #result {
            margin-top: 20px;
            display: none;
        }

        /* ===== РЕЗУЛЬТАТИ ===== */
        .result-title {
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            color: #3d2113;
            letter-spacing: 3px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #b8956a;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .cards-grid {
            display: grid;
            gap: 10px;
            margin-bottom: 12px;
        }

        .row-3 {
            grid-template-columns: repeat(3, 1fr);
        }
        .row-2 {
            grid-template-columns: repeat(2, 1fr);
        }
        .row-1 {
            grid-template-columns: 1fr;
            max-width: 33.33%;
            margin: 0 auto;
        }

        /* ===== НОВИЙ РЯД ДЛЯ ПОЗИЦІЙ 12, 13, 14 ===== */
        .row-extra {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
            padding-top: 12px;
            border-top: 2px dashed #b8860b;
        }

        .row-extra .row-1-extra {
            display: grid;
            grid-template-columns: 1fr;
            max-width: 33.33%;
            margin: 0 auto;
            width: 100%;
        }

        .row-extra .row-2-extra {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        .arcana-card {
            background: linear-gradient(145deg, #fcf8f2, #f0e8dc);
            border-radius: 14px;
            padding: 14px 8px 16px;
            text-align: center;
            border: 2px solid #b8956a;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(44, 24, 16, 0.08);
            min-height: 90px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
        }

        .arcana-card:active {
            transform: scale(0.96);
        }

        .arcana-card .position-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8b6b3c;
            font-weight: 700;
            margin-bottom: 4px;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .arcana-card .roman-number {
            font-size: 34px;
            font-weight: 700;
            color: #3d2113;
            line-height: 1;
            margin: 2px 0;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .arcana-card .arcana-name {
            font-size: 11px;
            font-weight: 700;
            color: #3d2113;
            margin-top: 4px;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        /* Виділена картка (Зверхдар) */
        .arcana-card.highlight {
            background: linear-gradient(145deg, #3d2113, #5c3a20);
            border-color: #d4a854;
            box-shadow: 0 4px 20px rgba(184, 149, 106, 0.3);
        }

        .arcana-card.highlight .position-label {
            color: #d4a854;
        }

        .arcana-card.highlight .roman-number {
            color: #f5ede4;
        }

        .arcana-card.highlight .arcana-name {
            color: #d4a854;
        }

        /* ===== КНОПКА СКИДАННЯ ===== */
        .reset-btn {
            margin-top: 15px;
            background: #e8dccc;
            color: #3d2113;
            font-size: 15px;
            padding: 14px;
            height: auto;
            border-color: #b8956a;
            text-shadow: none;
            width: 100%;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .reset-btn:hover {
            background: #dcccb8;
            box-shadow: 0 5px 20px rgba(92, 58, 32, 0.2);
            transform: translateY(-2px);
        }

        /* ===== TELEGRAM ===== */
        .telegram-link {
            margin-top: 20px;
            padding: 16px;
            text-align: center;
            background: linear-gradient(145deg, #3d2113, #5c3a20);
            border-radius: 16px;
            border: 2px solid #b8860b;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .telegram-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(92, 58, 32, 0.4);
        }

        .telegram-link a {
            color: #d4a854;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .telegram-link a:hover {
            color: #f5ede4;
        }

        .telegram-link .telegram-icon {
            font-size: 28px;
        }

        .telegram-link .telegram-text {
            font-size: 14px;
            font-weight: 400;
            color: #b8956a;
            display: block;
            margin-top: 4px;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 500px) {
            .container {
                padding: 18px 14px 25px;
                border-radius: 18px;
            }

            .main-title {
                font-size: 24px;
                letter-spacing: 2px;
            }

            .sub-title {
                font-size: 10px;
                letter-spacing: 3px;
            }

            .date-input-wrapper input {
                font-size: 17px;
                padding: 14px 8px;
                height: 56px;
            }

            .date-input-wrapper .separator {
                font-size: 20px;
            }

            button {
                font-size: 18px;
                padding: 16px;
                height: 56px;
            }

            .arcana-card {
                padding: 10px 6px 12px;
                min-height: 75px;
            }

            .arcana-card .roman-number {
                font-size: 26px;
            }

            .arcana-card .arcana-name {
                font-size: 9px;
            }

            .row-1, .row-1-extra {
                max-width: 40%;
            }

            .telegram-link a {
                font-size: 16px;
            }

            .telegram-link .telegram-icon {
                font-size: 24px;
            }
        }

        @media (max-width: 380px) {
            .container {
                padding: 12px 10px 20px;
            }

            .main-title {
                font-size: 20px;
            }

            .sub-title {
                font-size: 9px;
                letter-spacing: 2px;
            }

            .date-input-wrapper input {
                font-size: 15px;
                padding: 12px 6px;
                height: 50px;
            }

            .date-input-wrapper .separator {
                font-size: 16px;
            }

            button {
                font-size: 16px;
                padding: 14px;
                height: 50px;
            }

            .arcana-card .roman-number {
                font-size: 22px;
            }

            .arcana-card .arcana-name {
                font-size: 8px;
            }

            .row-1, .row-1-extra {
                max-width: 50%;
            }
        }

        @media (min-width: 768px) {
            .container {
                max-width: 600px;
                padding: 35px 30px 40px;
            }

            .main-title {
                font-size: 36px;
            }

            .date-input-wrapper input {
                height: 64px;
                font-size: 22px;
            }

            button {
                height: 64px;
                font-size: 22px;
            }

            .arcana-card .roman-number {
                font-size: 40px;
            }

            .arcana-card .arcana-name {
                font-size: 13px;
            }
        }

        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px #fcf8f2 inset !important;
            -webkit-text-fill-color: #2c1810 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="main-title">
            Шлях <span>Героя</span>
        </div>
        <div class="sub-title">
            <span>✦</span> Калькулятор Архетипів <span>✦</span>
        </div>

        <div class="input-group">
            <label for="day">📅 Ваша дата народження</label>
            <div class="date-input-wrapper">
                <input type="text" id="day" placeholder="ДД" maxlength="2" inputmode="numeric" value="">
                <span class="separator">.</span>
                <input type="text" id="month" placeholder="ММ" maxlength="2" inputmode="numeric" value="">
                <span class="separator">.</span>
                <input type="text" id="year" placeholder="РРРР" maxlength="4" inputmode="numeric" value="">
            </div>
        </div>

        <button onclick="calculate()">✨ Розрахувати</button>

        <div id="result"></div>

        <div class="telegram-link">
            <a href="https://t.me/arxitipnumerolog" target="_blank">
                <span class="telegram-icon">📲</span>
                <div>
                    @arxitipnumerolog
                    <span class="telegram-text">Підписуйтесь на Telegram-канал</span>
                </div>
            </a>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. НАЗВИ АРКАНІВ (1-22)
        // ============================================================
        const arcanaNames = {
            1: "Маг",
            2: "Верховна Жриця",
            3: "Імператриця",
            4: "Імператор",
            5: "Ієрофант",
            6: "Закохані",
            7: "Колісниця",
            8: "Сила",
            9: "Відлюдник",
            10: "Колесо Фортуни",
            11: "Справедливість",
            12: "Повішений",
            13: "Смерть",
            14: "Помірність",
            15: "Диявол",
            16: "Вежа",
            17: "Зірка",
            18: "Місяць",
            19: "Сонце",
            20: "Суд",
            21: "Світ",
            22: "Блазень"
        };

        // ============================================================
        // 2. ПЕРЕТВОРЕННЯ НА РИМСЬКЕ
        // ============================================================
        function toRoman(num) {
            const romanMap = {
                1: 'I', 2: 'II', 3: 'III', 4: 'IV', 5: 'V',
                6: 'VI', 7: 'VII', 8: 'VIII', 9: 'IX', 10: 'X',
                11: 'XI', 12: 'XII', 13: 'XIII', 14: 'XIV', 15: 'XV',
                16: 'XVI', 17: 'XVII', 18: 'XVIII', 19: 'XIX', 20: 'XX',
                21: 'XXI', 22: 'XXII'
            };
            return romanMap[num] || num;
        }

        // ============================================================
        // 3. ЛОГІКА РОЗРАХУНКІВ
        // ============================================================
        function reduceTo22(number) {
            while (number > 22) {
                number -= 22;
            }
            return number;
        }

        function calculate() {
            const dayInput = document.getElementById('day');
            const monthInput = document.getElementById('month');
            const yearInput = document.getElementById('year');
            const resultDiv = document.getElementById('result');

            const day = parseInt(dayInput.value);
            const month = parseInt(monthInput.value);
            const year = parseInt(yearInput.value);

            if (!day || !month || !year) {
                alert('Будь ласка, заповніть всі поля: день, місяць та рік');
                return;
            }

            if (day < 1 || day > 31 || month < 1 || month > 12 || year < 1900 || year > 2100) {
                alert('Будь ласка, введіть коректну дату');
                return;
            }

            // ===== ОСНОВНІ ПОЗИЦІЇ (1-8) =====
            const pos1 = reduceTo22(day);
            const pos2 = reduceTo22(month);

            let yearSum = 0;
            for (const char of year.toString()) {
                yearSum += parseInt(char);
            }
            const pos3 = reduceTo22(yearSum);

            const pos4 = reduceTo22(pos1 + pos2);
            const pos5 = reduceTo22(pos2 + pos3);
            const pos6 = reduceTo22(pos4 + pos5);
            const pos7 = reduceTo22(pos3 + pos4);
            const pos8 = reduceTo22(pos2 + pos6);

            // ===== ДОДАТКОВІ ПОЗИЦІЇ =====
            const pos12 = reduceTo22(pos7 + pos8);
            const pos13 = reduceTo22(pos1 + pos4 + pos6);
            const pos14 = reduceTo22(pos3 + pos5 + pos6);

            // ===== МАСИВИ =====
            const mainPositions = [
                { num: pos1, label: "1", title: "Дитинство" },
                { num: pos2, label: "2", title: "Зрілість" },
                { num: pos3, label: "3", title: "Підсумок" },
                { num: pos4, label: "4", title: "Страхи" },
                { num: pos5, label: "5", title: "Талант" },
                { num: pos6, label: "6", title: "Дар" },
                { num: pos7, label: "7", title: "Місія" },
                { num: pos8, label: "8", title: "Зверхдар" }
            ];

            // ===== НОВИЙ ПОРЯДОК: 12 окремо, 13 і 14 разом =====
            const extraPosition12 = { num: pos12, label: "12", title: "Синтез" };
            const extraPosition13 = { num: pos13, label: "13", title: "Душа" };
            const extraPosition14 = { num: pos14, label: "14", title: "Шлях" };

            // ===== БУДУЄМО HTML =====
            let html = `
                <div class="result-title">✦ Ваші Архетипи ✦</div>
                
                <!-- Ряд 1: Позиції 1, 2, 3 -->
                <div class="cards-grid row-3">
                    ${renderCard(mainPositions[0], false)}
                    ${renderCard(mainPositions[1], false)}
                    ${renderCard(mainPositions[2], false)}
                </div>

                <!-- Ряд 2: Позиції 4, 5 -->
                <div class="cards-grid row-2">
                    ${renderCard(mainPositions[3], false)}
                    ${renderCard(mainPositions[4], false)}
                </div>

                <!-- Ряд 3: Позиція 6 -->
                <div class="cards-grid row-1">
                    ${renderCard(mainPositions[5], false)}
                </div>

                <!-- Ряд 4: Позиції 7, 8 (8 - виділена) -->
                <div class="cards-grid row-2">
                    ${renderCard(mainPositions[6], false)}
                    ${renderCard(mainPositions[7], true)}
                </div>

                <!-- ===== НОВІ ПОЗИЦІЇ (12, 13, 14) ===== -->
                <div class="row-extra">
                    <!-- Позиція 12 - окремий рядок -->
                    <div class="row-1-extra">
                        ${renderCard(extraPosition12, false)}
                    </div>
                    
                    <!-- Позиції 13 та 14 - разом -->
                    <div class="row-2-extra">
                        ${renderCard(extraPosition13, false)}
                        ${renderCard(extraPosition14, false)}
                    </div>
                </div>

                <button class="reset-btn" onclick="resetResults()">🔄 Очистити результати</button>
            `;

            resultDiv.innerHTML = html;
            resultDiv.style.display = 'block';
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // Функція для рендерингу однієї картки
        function renderCard(pos, isHighlight) {
            const name = arcanaNames[pos.num] || `Аркан ${pos.num}`;
            const roman = toRoman(pos.num);

            return `
                <div class="arcana-card ${isHighlight ? 'highlight' : ''}">
                    <div class="position-label">Поз. ${pos.label}</div>
                    <div class="roman-number">${roman}</div>
                    <div class="arcana-name">${name}</div>
                </div>
            `;
        }

        function resetResults() {
            document.getElementById('result').style.display = 'none';
            document.getElementById('result').innerHTML = '';
            document.getElementById('day').value = '';
            document.getElementById('month').value = '';
            document.getElementById('year').value = '';
            document.getElementById('day').focus();
        }

        // ============================================================
        // 4. АВТОМАТИЧНЕ ПЕРЕХОДЖЕННЯ
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const dayInput = document.getElementById('day');
            const monthInput = document.getElementById('month');
            const yearInput = document.getElementById('year');

            dayInput.addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, '').slice(0, 2);
                if (this.value.length === 2) monthInput.focus();
            });

            monthInput.addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, '').slice(0, 2);
                if (this.value.length === 2) yearInput.focus();
            });

            yearInput.addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, '').slice(0, 4);
            });

            dayInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') monthInput.focus();
            });

            monthInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') yearInput.focus();
            });

            yearInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') calculate();
            });

            dayInput.focus();
        });
    </script>
</body>
</html>
