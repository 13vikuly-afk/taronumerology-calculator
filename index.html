<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=yes">
    <title>Шлях Героя - Калькулятор Архетипів</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Georgia', 'Times New Roman', serif;
            background: #1a0f0a;
            min-height: 100vh;
            padding: 15px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
        }

        /* ===== ФОН ІЗ КАРТИНКОЮ "ШЛЯХ ГЕРОЯ" ===== */
        .container {
            background: linear-gradient(145deg, rgba(245, 237, 228, 0.92), rgba(232, 220, 204, 0.92)),
                        url('https://images.unsplash.com/photo-1504280390367-361c6d9f38f4?w=600&h=800&fit=crop') center/cover no-repeat;
            max-width: 500px;
            width: 100%;
            padding: 25px 20px 30px;
            border-radius: 24px;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.7), 0 0 0 2px #b8860b inset;
            margin-top: 10px;
            font-family: 'Georgia', 'Times New Roman', serif;
            backdrop-filter: blur(2px);
            position: relative;
            overflow: hidden;
        }

        /* ===== ДЕКОРАТИВНИЙ ЕЛЕМЕНТ "ШЛЯХ" ===== */
        .hero-path {
            text-align: center;
            margin-bottom: 12px;
            font-size: 12px;
            letter-spacing: 6px;
            color: #8b6b3c;
            font-weight: 700;
            text-transform: uppercase;
            border-bottom: 1px solid rgba(184, 149, 106, 0.3);
            padding-bottom: 8px;
        }
        .hero-path span {
            color: #b8860b;
        }

        .main-title {
            text-align: center;
            font-size: 30px;
            font-weight: 700;
            color: #3d2113;
            letter-spacing: 4px;
            text-shadow: 1px 1px 0 rgba(184, 149, 106, 0.3);
            line-height: 1.2;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .main-title span {
            color: #b8860b;
        }

        .sub-title {
            text-align: center;
            font-size: 13px;
            color: #8b6b3c;
            font-weight: 700;
            letter-spacing: 5px;
            text-transform: uppercase;
            margin-top: 2px;
            margin-bottom: 16px;
            border-bottom: 2px solid #b8956a;
            padding-bottom: 12px;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .sub-title span {
            color: #b8860b;
        }

        .input-group {
            margin-bottom: 16px;
        }

        label {
            display: block;
            font-weight: 700;
            color: #3d2113;
            margin-bottom: 6px;
            font-size: 15px;
            letter-spacing: 0.5px;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .date-input-wrapper {
            display: flex;
            gap: 8px;
            align-items: center;
        }

        .date-input-wrapper input {
            flex: 1;
            padding: 16px 12px;
            border: 2px solid #b8860b;
            border-radius: 14px;
            font-size: 18px;
            background: rgba(252, 248, 242, 0.9);
            transition: border-color 0.3s, box-shadow 0.3s;
            color: #2c1810;
            font-weight: 600;
            height: 60px;
            text-align: center;
            min-width: 0;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .date-input-wrapper input:focus {
            outline: none;
            border-color: #8b6b3c;
            box-shadow: 0 0 0 4px rgba(184, 149, 106, 0.25);
        }

        .date-input-wrapper input::placeholder {
            color: #b8956a;
            font-weight: 400;
            font-size: 14px;
        }

        .date-input-wrapper .separator {
            font-size: 24px;
            font-weight: 700;
            color: #b8860b;
            padding: 0 2px;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        button {
            width: 100%;
            padding: 18px;
            background: linear-gradient(135deg, #5c3a20, #3d2113);
            color: #f5ede4;
            border: 2px solid #b8860b;
            border-radius: 14px;
            font-size: 20px;
            font-weight: 700;
            cursor: pointer;
            transition: transform 0.2s, box-shadow 0.2s, background 0.3s;
            letter-spacing: 2px;
            height: 60px;
            text-shadow: 0 1px 2px rgba(0, 0, 0, 0.3);
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        button:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 30px rgba(92, 58, 32, 0.4);
            background: linear-gradient(135deg, #6b4628, #4a2818);
        }

        button:active {
            transform: translateY(0);
            box-shadow: 0 5px 15px rgba(92, 58, 32, 0.3);
        }

        #result {
            margin-top: 20px;
            display: none;
        }

        /* ===== РЕЗУЛЬТАТИ ===== */
        .result-title {
            text-align: center;
            font-size: 16px;
            font-weight: 700;
            color: #3d2113;
            letter-spacing: 3px;
            margin-bottom: 15px;
            padding-bottom: 10px;
            border-bottom: 2px solid #b8956a;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .cards-grid {
            display: grid;
            gap: 10px;
            margin-bottom: 12px;
        }

        .row-3 {
            grid-template-columns: repeat(3, 1fr);
        }
        .row-2 {
            grid-template-columns: repeat(2, 1fr);
        }
        .row-1 {
            grid-template-columns: 1fr;
            max-width: 33.33%;
            margin: 0 auto;
        }

        /* ===== НОВІ ПОЗИЦІЇ 12, 13, 14 ===== */
        .row-extra {
            display: flex;
            flex-direction: column;
            gap: 10px;
            margin-top: 8px;
            padding-top: 12px;
            border-top: 2px dashed #b8860b;
        }

        .row-extra .row-1-extra {
            display: grid;
            grid-template-columns: 1fr;
            max-width: 33.33%;
            margin: 0 auto;
            width: 100%;
        }

        .row-extra .row-2-extra {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 10px;
        }

        /* ===== КАРТКА АРКАНУ ===== */
        .arcana-card {
            background: rgba(252, 248, 242, 0.92);
            border-radius: 14px;
            padding: 12px 6px 14px;
            text-align: center;
            border: 2px solid #b8956a;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: 0 2px 8px rgba(44, 24, 16, 0.08);
            min-height: 100px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            backdrop-filter: blur(4px);
        }

        .arcana-card:active {
            transform: scale(0.96);
        }

        .arcana-card .position-label {
            font-size: 9px;
            text-transform: uppercase;
            letter-spacing: 2px;
            color: #8b6b3c;
            font-weight: 700;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .arcana-card .position-name {
            font-size: 11px;
            font-weight: 700;
            color: #3d2113;
            letter-spacing: 1px;
            font-family: 'Georgia', 'Times New Roman', serif;
            margin-bottom: 2px;
        }

        .arcana-card .roman-number {
            font-size: 32px;
            font-weight: 700;
            color: #3d2113;
            line-height: 1;
            margin: 2px 0;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .arcana-card .arcana-name {
            font-size: 11px;
            font-weight: 700;
            color: #3d2113;
            line-height: 1.2;
            text-transform: uppercase;
            letter-spacing: 1px;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        /* ===== ПОЗНАЧКИ (РІД + ТИП) ===== */
        .arcana-card .tags {
            display: flex;
            gap: 6px;
            margin-top: 4px;
            justify-content: center;
            flex-wrap: wrap;
        }

        .arcana-card .tag {
            font-size: 8px;
            font-weight: 700;
            padding: 2px 8px;
            border-radius: 20px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .tag-male {
            background: #2c5f7a;
            color: #fff;
        }
        .tag-female {
            background: #8b3a5a;
            color: #fff;
        }
        .tag-neutral {
            background: #6b6b6b;
            color: #fff;
        }
        .tag-spiritual {
            background: #3d6b3d;
            color: #fff;
        }
        .tag-material {
            background: #8b6b3c;
            color: #fff;
        }
        .tag-neutral-type {
            background: #6b6b6b;
            color: #fff;
        }

        /* Виділена картка (Зверхдар / Дар) */
        .arcana-card.highlight {
            background: linear-gradient(145deg, #3d2113, #5c3a20);
            border-color: #d4a854;
            box-shadow: 0 4px 20px rgba(184, 149, 106, 0.3);
        }

        .arcana-card.highlight .position-label,
        .arcana-card.highlight .position-name,
        .arcana-card.highlight .roman-number,
        .arcana-card.highlight .arcana-name {
            color: #f5ede4;
        }

        .arcana-card.highlight .tag-male,
        .arcana-card.highlight .tag-female,
        .arcana-card.highlight .tag-neutral,
        .arcana-card.highlight .tag-spiritual,
        .arcana-card.highlight .tag-material,
        .arcana-card.highlight .tag-neutral-type {
            opacity: 0.9;
        }

        /* ===== КНОПКА СКИДАННЯ ===== */
        .reset-btn {
            margin-top: 15px;
            background: #e8dccc;
            color: #3d2113;
            font-size: 15px;
            padding: 14px;
            height: auto;
            border-color: #b8956a;
            text-shadow: none;
            width: 100%;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .reset-btn:hover {
            background: #dcccb8;
            box-shadow: 0 5px 20px rgba(92, 58, 32, 0.2);
            transform: translateY(-2px);
        }

        /* ===== TELEGRAM ===== */
        .telegram-link {
            margin-top: 20px;
            padding: 16px;
            text-align: center;
            background: linear-gradient(145deg, #3d2113, #5c3a20);
            border-radius: 16px;
            border: 2px solid #b8860b;
            transition: transform 0.3s, box-shadow 0.3s;
        }

        .telegram-link:hover {
            transform: translateY(-3px);
            box-shadow: 0 8px 30px rgba(92, 58, 32, 0.4);
        }

        .telegram-link a {
            color: #d4a854;
            text-decoration: none;
            font-size: 18px;
            font-weight: 700;
            letter-spacing: 1px;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        .telegram-link a:hover {
            color: #f5ede4;
        }

        .telegram-link .telegram-icon {
            font-size: 28px;
        }

        .telegram-link .telegram-text {
            font-size: 14px;
            font-weight: 400;
            color: #b8956a;
            display: block;
            margin-top: 4px;
            font-family: 'Georgia', 'Times New Roman', serif;
        }

        /* ===== АДАПТИВ ===== */
        @media (max-width: 500px) {
            .container {
                padding: 18px 14px 25px;
                border-radius: 18px;
            }

            .main-title {
                font-size: 24px;
                letter-spacing: 2px;
            }

            .sub-title {
                font-size: 10px;
                letter-spacing: 3px;
            }

            .date-input-wrapper input {
                font-size: 17px;
                padding: 14px 8px;
                height: 56px;
            }

            .date-input-wrapper .separator {
                font-size: 20px;
            }

            button {
                font-size: 18px;
                padding: 16px;
                height: 56px;
            }

            .arcana-card {
                padding: 10px 4px 12px;
                min-height: 80px;
            }

            .arcana-card .roman-number {
                font-size: 24px;
            }

            .arcana-card .arcana-name {
                font-size: 9px;
            }

            .arcana-card .position-name {
                font-size: 9px;
            }

            .arcana-card .tag {
                font-size: 7px;
                padding: 1px 6px;
            }

            .row-1,
            .row-1-extra {
                max-width: 40%;
            }

            .telegram-link a {
                font-size: 16px;
            }

            .telegram-link .telegram-icon {
                font-size: 24px;
            }
        }

        @media (max-width: 380px) {
            .container {
                padding: 12px 10px 20px;
            }

            .main-title {
                font-size: 20px;
            }

            .sub-title {
                font-size: 9px;
                letter-spacing: 2px;
            }

            .date-input-wrapper input {
                font-size: 15px;
                padding: 12px 6px;
                height: 50px;
            }

            .date-input-wrapper .separator {
                font-size: 16px;
            }

            button {
                font-size: 16px;
                padding: 14px;
                height: 50px;
            }

            .arcana-card .roman-number {
                font-size: 20px;
            }

            .arcana-card .arcana-name {
                font-size: 8px;
            }

            .arcana-card .position-name {
                font-size: 8px;
            }

            .row-1,
            .row-1-extra {
                max-width: 50%;
            }
        }

        @media (min-width: 768px) {
            .container {
                max-width: 600px;
                padding: 35px 30px 40px;
            }

            .main-title {
                font-size: 36px;
            }

            .date-input-wrapper input {
                height: 64px;
                font-size: 22px;
            }

            button {
                height: 64px;
                font-size: 22px;
            }

            .arcana-card .roman-number {
                font-size: 38px;
            }

            .arcana-card .arcana-name {
                font-size: 13px;
            }

            .arcana-card .position-name {
                font-size: 13px;
            }
        }

        input:-webkit-autofill {
            -webkit-box-shadow: 0 0 0 1000px rgba(252, 248, 242, 0.9) inset !important;
            -webkit-text-fill-color: #2c1810 !important;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- ===== ДЕКОРАТИВНИЙ ЕЛЕМЕНТ "ШЛЯХ" ===== -->
        <div class="hero-path">
            <span>✦</span> Шлях <span>✦</span>
        </div>

        <div class="main-title">
            Шлях <span>Героя</span>
        </div>
        <div class="sub-title">
            <span>✦</span> Калькулятор Архетипів <span>✦</span>
        </div>

        <div class="input-group">
            <label for="day">📅 Ваша дата народження</label>
            <div class="date-input-wrapper">
                <input type="text" id="day" placeholder="ДД" maxlength="2" inputmode="numeric" value="">
                <span class="separator">.</span>
                <input type="text" id="month" placeholder="ММ" maxlength="2" inputmode="numeric" value="">
                <span class="separator">.</span>
                <input type="text" id="year" placeholder="РРРР" maxlength="4" inputmode="numeric" value="">
            </div>
        </div>

        <button onclick="calculate()">✨ Розрахувати</button>

        <div id="result"></div>

        <div class="telegram-link">
            <a href="https://t.me/arxitipnumerolog" target="_blank">
                <span class="telegram-icon">📲</span>
                <div>
                    @arxitipnumerolog
                    <span class="telegram-text">Підписуйтесь на Telegram-канал</span>
                </div>
            </a>
        </div>
    </div>

    <script>
        // ============================================================
        // 1. ДАНІ ПРО АРКАНИ (1-22)
        // ============================================================
        const arcanaData = {
            1: { name: "Маг", gender: "Чоловічий", genderTag: "male", type: "Матеріальний", typeTag: "material" },
            2: { name: "Жриця", gender: "Жіночий", genderTag: "female", type: "Духовний", typeTag: "spiritual" },
            3: { name: "Імператриця", gender: "Жіночий", genderTag: "female", type: "Матеріальний", typeTag: "material" },
            4: { name: "Імператор", gender: "Чоловічий", genderTag: "male", type: "Матеріальний", typeTag: "material" },
            5: { name: "Ієрофант", gender: "Чоловічий", genderTag: "male", type: "Духовний", typeTag: "spiritual" },
            6: { name: "Закохані", gender: "Нейтральний", genderTag: "neutral", type: "Нейтральний", typeTag: "neutral-type" },
            7: { name: "Колісниця", gender: "Чоловічий", genderTag: "male", type: "Матеріальний", typeTag: "material" },
            8: { name: "Справедливість", gender: "Нейтральний", genderTag: "neutral", type: "Нейтральний", typeTag: "neutral-type" },
            9: { name: "Відлюдник", gender: "Чоловічий", genderTag: "male", type: "Духовний", typeTag: "spiritual" },
            10: { name: "Колесо Фортуни", gender: "Нейтральний", genderTag: "neutral", type: "Нейтральний", typeTag: "neutral-type" },
            11: { name: "Сила", gender: "Жіночий", genderTag: "female", type: "Матеріальний", typeTag: "material" },
            12: { name: "Повішений", gender: "Нейтральний", genderTag: "neutral", type: "Духовний", typeTag: "spiritual" },
            13: { name: "Смерть", gender: "Нейтральний", genderTag: "neutral", type: "Духовний", typeTag: "spiritual" },
            14: { name: "Помірність", gender: "Нейтральний", genderTag: "neutral", type: "Духовний", typeTag: "spiritual" },
            15: { name: "Диявол", gender: "Чоловічий", genderTag: "male", type: "Матеріальний", typeTag: "material" },
            16: { name: "Вежа", gender: "Чоловічий", genderTag: "male", type: "Матеріальний", typeTag: "material" },
            17: { name: "Зірка", gender: "Жіночий", genderTag: "female", type: "Духовний", typeTag: "spiritual" },
            18: { name: "Місяць", gender: "Жіночий", genderTag: "female", type: "Духовний", typeTag: "spiritual" },
            19: { name: "Сонце", gender: "Чоловічий", genderTag: "male", type: "Матеріальний", typeTag: "material" },
            20: { name: "Суд", gender: "Нейтральний", genderTag: "neutral", type: "Духовний", typeTag: "spiritual" },
            21: { name: "Світ", gender: "Нейтральний", genderTag: "neutral", type: "Нейтральний", typeTag: "neutral-type" },
            22: { name: "Блазень", gender: "Нейтральний", genderTag: "neutral", type: "Нейтральний", typeTag: "neutral-type" }
        };

        // ============================================================
        // 2. НАЗВИ ПОЗИЦІЙ (УКРАЇНСЬКОЮ)
        // ============================================================
        const positionNames = {
            1: "Юність",
            2: "Зрілість",
            3: "Старість",
            4: "Травма",
            5: "Ціль",
            6: "Талант",
            7: "Місія",
            8: "Дар",
            12: "Комфорт",
            13: "Самооцінка",
            14: "Враження"
        };

        // ============================================================
        // 3. ПЕРЕТВОРЕННЯ НА РИМСЬКЕ
        // ============================================================
        function toRoman(num) {
            const romanMap = {
                1: 'I', 2: 'II', 3: 'III', 4: 'IV', 5: 'V',
                6: 'VI', 7: 'VII', 8: 'VIII', 9: 'IX', 10: 'X',
                11: 'XI', 12: 'XII', 13: 'XIII', 14: 'XIV', 15: 'XV',
                16: 'XVI', 17: 'XVII', 18: 'XVIII', 19: 'XIX', 20: 'XX',
                21: 'XXI', 22: 'XXII'
            };
            return romanMap[num] || num;
        }

        // ============================================================
        // 4. ЛОГІКА РОЗРАХУНКІВ
        // ============================================================
        function reduceTo22(number) {
            while (number > 22) {
                number -= 22;
            }
            return number;
        }

        function calculate() {
            const dayInput = document.getElementById('day');
            const monthInput = document.getElementById('month');
            const yearInput = document.getElementById('year');
            const resultDiv = document.getElementById('result');

            const day = parseInt(dayInput.value);
            const month = parseInt(monthInput.value);
            const year = parseInt(yearInput.value);

            if (!day || !month || !year) {
                alert('Будь ласка, заповніть всі поля: день, місяць та рік');
                return;
            }

            if (day < 1 || day > 31 || month < 1 || month > 12 || year < 1900 || year > 2100) {
                alert('Будь ласка, введіть коректну дату');
                return;
            }

            // ===== ОСНОВНІ ПОЗИЦІЇ (1-8) =====
            const pos1 = reduceTo22(day);
            const pos2 = reduceTo22(month);

            let yearSum = 0;
            for (const char of year.toString()) {
                yearSum += parseInt(char);
            }
            const pos3 = reduceTo22(yearSum);

            const pos4 = reduceTo22(pos1 + pos2);
            const pos5 = reduceTo22(pos2 + pos3);
            const pos6 = reduceTo22(pos4 + pos5);
            const pos7 = reduceTo22(pos3 + pos4);
            const pos8 = reduceTo22(pos2 + pos6);

            // ===== ДОДАТКОВІ ПОЗИЦІЇ =====
            const pos12 = reduceTo22(pos7 + pos8);
            const pos13 = reduceTo22(pos1 + pos4 + pos6);
            const pos14 = reduceTo22(pos3 + pos5 + pos6);

            // ===== МАСИВИ =====
            const mainPositions = [
                { num: pos1, label: "01", key: 1 },
                { num: pos2, label: "02", key: 2 },
                { num: pos3, label: "03", key: 3 },
                { num: pos4, label: "04", key: 4 },
                { num: pos5, label: "05", key: 5 },
                { num: pos6, label: "06", key: 6 },
                { num: pos7, label: "07", key: 7 },
                { num: pos8, label: "08", key: 8 }
            ];

            const extraPositions = [
                { num: pos12, label: "12", key: 12 },
                { num: pos13, label: "13", key: 13 },
                { num: pos14, label: "14", key: 14 }
            ];

            // ===== БУДУЄМО HTML =====
            let html = `
                <div class="result-title">✦ Ваші Архетипи ✦</div>
                
                <!-- Ряд 1: Позиції 1, 2, 3 -->
                <div class="cards-grid row-3">
                    ${renderCard(mainPositions[0], false)}
                    ${renderCard(mainPositions[1], false)}
                    ${renderCard(mainPositions[2], false)}
                </div>

                <!-- Ряд 2: Позиції 4, 5 -->
                <div class="cards-grid row-2">
                    ${renderCard(mainPositions[3], false)}
                    ${renderCard(mainPositions[4], false)}
                </div>

                <!-- Ряд 3: Позиція 6 -->
                <div class="cards-grid row-1">
                    ${renderCard(mainPositions[5], false)}
                </div>

                <!-- Ряд 4: Позиції 7, 8 (8 - виділена) -->
                <div class="cards-grid row-2">
                    ${renderCard(mainPositions[6], false)}
                    ${renderCard(mainPositions[7], true)}
                </div>

                <!-- ===== НОВІ ПОЗИЦІЇ (12, 13, 14) ===== -->
                <div class="row-extra">
                    <div class="row-1-extra">
                        ${renderCard(extraPositions[0], false)}
                    </div>
                    <div class="row-2-extra">
                        ${renderCard(extraPositions[1], false)}
                        ${renderCard(extraPositions[2], false)}
                    </div>
                </div>

                <button class="reset-btn" onclick="resetResults()">🔄 Очистити результати</button>
            `;

            resultDiv.innerHTML = html;
            resultDiv.style.display = 'block';
            resultDiv.scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        // ============================================================
        // 5. ФУНКЦІЯ ДЛЯ ВІДОБРАЖЕННЯ ОДНІЄЇ КАРТКИ
        // ============================================================
        function renderCard(pos, isHighlight) {
            const data = arcanaData[pos.num] || { name: `Аркан ${pos.num}`, gender: "", genderTag: "", type: "", typeTag: "" };
            const roman = toRoman(pos.num);
            const posName = positionNames[pos.key] || `Поз. ${pos.label}`;

            // Теги для роду
            let genderTagClass = '';
            let genderLabel = data.gender;
            if (data.genderTag === 'male') genderTagClass = 'tag-male';
            else if (data.genderTag === 'female') genderTagClass = 'tag-female';
            else if (data.genderTag === 'neutral') genderTagClass = 'tag-neutral';

            // Теги для типу (Д / М)
            let typeTagClass = '';
            let typeLabel = data.type;
            if (data.typeTag === 'spiritual') typeTagClass = 'tag-spiritual';
            else if (data.typeTag === 'material') typeTagClass = 'tag-material';
            else if (data.typeTag === 'neutral-type') typeTagClass = 'tag-neutral-type';

            // Скорочення для типу (Д / М)
            let typeShort = '';
            if (data.typeTag === 'spiritual') typeShort = 'Д';
            else if (data.typeTag === 'material') typeShort = 'М';
            else typeShort = 'Н';

            return `
                <div class="arcana-card ${isHighlight ? 'highlight' : ''}">
                    <div class="position-label">Поз. ${pos.label}</div>
                    <div class="position-name">${posName}</div>
                    <div class="roman-number">${roman}</div>
                    <div class="arcana-name">${data.name}</div>
                    <div class="tags">
                        <span class="tag ${genderTagClass}">${genderLabel}</span>
                        <span class="tag ${typeTagClass}">${typeShort}</span>
                    </div>
                </div>
            `;
        }

        function resetResults() {
            document.getElementById('result').style.display = 'none';
            document.getElementById('result').innerHTML = '';
            document.getElementById('day').value = '';
            document.getElementById('month').value = '';
            document.getElementById('year').value = '';
            document.getElementById('day').focus();
        }

        // ============================================================
        // 6. АВТОМАТИЧНЕ ПЕРЕХОДЖЕННЯ
        // ============================================================
        document.addEventListener('DOMContentLoaded', function() {
            const dayInput = document.getElementById('day');
            const monthInput = document.getElementById('month');
            const yearInput = document.getElementById('year');

            dayInput.addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, '').slice(0, 2);
                if (this.value.length === 2) monthInput.focus();
            });

            monthInput.addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, '').slice(0, 2);
                if (this.value.length === 2) yearInput.focus();
            });

            yearInput.addEventListener('input', function() {
                this.value = this.value.replace(/\D/g, '').slice(0, 4);
            });

            dayInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') monthInput.focus();
            });

            monthInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') yearInput.focus();
            });

            yearInput.addEventListener('keydown', function(e) {
                if (e.key === 'Enter') calculate();
            });

            dayInput.focus();
        });
    </script>
</body>
</html>
